#!/usr/sbin/nft -f
# nftables-perimeter.conf
# Stateful perimeter firewall — SME network edge
# ISO 27001 A.8.20, A.8.21
# Author: Giselle Koch

flush ruleset

table inet filter {

    ct helper ftp-standard {
        type "ftp" protocol tcp
    }

    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback
        iif "lo" accept

        # Established / related
        ct state established,related accept

        # ICMP — rate limited
        ip  protocol icmp  icmp  type echo-request limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second accept

        # SSH — management VLAN only (VLAN 40 = 10.40.0.0/24)
        ip saddr 10.40.0.0/24 tcp dport 22 ct state new \
            limit rate 4/minute burst 5 packets accept

        # HTTPS inbound to DMZ web server
        ip daddr 10.10.0.10 tcp dport 443 ct state new accept

        # DNS from internal zones only
        ip saddr { 10.20.0.0/24, 10.30.0.0/24, 10.40.0.0/24 } \
            udp dport 53 accept

        # Log and drop everything else
        limit rate 5/minute log prefix "[NFT-DROP-IN] " flags all
        drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept

        # LAN → Internet (HTTP/HTTPS/DNS)
        ip saddr 10.20.0.0/24 oif "eth0" tcp dport { 80, 443 } ct state new accept
        ip saddr 10.20.0.0/24 oif "eth0" udp dport 53 accept

        # MGMT → all internal zones
        ip saddr 10.40.0.0/24 ip daddr { 10.10.0.0/24, 10.20.0.0/24, 10.30.0.0/24 } accept

        # DMZ → Internet only (no DMZ → LAN)
        ip saddr 10.10.0.0/24 oif "eth0" accept

        # Block DMZ → LAN (prevent pivot)
        ip saddr 10.10.0.0/24 ip daddr 10.20.0.0/24 drop

        # GUEST → Internet only
        ip saddr 10.30.0.0/24 oif "eth0" tcp dport { 80, 443 } accept

        # Log dropped forwards
        limit rate 5/minute log prefix "[NFT-DROP-FWD] " flags all
        drop
    }

    chain output {
        type filter hook output priority 0; policy drop;

        # Loopback
        oif "lo" accept

        # Established / related outbound
        ct state established,related accept

        # DNS outbound (to upstream resolvers)
        udp dport 53 ct state new accept
        tcp dport 53 ct state new accept

        # HTTP/HTTPS outbound (for system updates, NTP)
        tcp dport { 80, 443 } ct state new accept

        # NTP outbound
        udp dport 123 ct state new accept

        # ICMP outbound
        ip protocol icmp accept

        # Log and drop unexpected outbound
        limit rate 5/minute log prefix "[NFT-DROP-OUT] " flags all
        drop
    }
}
